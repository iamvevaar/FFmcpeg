name: Build and Release

# GitHub is moving Actions (checkout, setup-node, etc.) to Node 24 — silence deprecation & stay current
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*' # Trigger when you push a tag like v1.0.0
  workflow_dispatch: # Allow running manually

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      # If one OS fails (e.g. macOS signing), still publish Windows/Linux artifacts
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Windows: NSIS/electron-builder often fails with "cannot open" / ENOENT on long
      # absolute paths into node_modules (MAX_PATH / NSIS). Enable OS long paths.
      - name: Windows — enable long paths (NSIS)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Must not use bash-only syntax. Plain `run: node -e '...{ stdio: ...}'` is invalid YAML (colon in `stdio:`)
      - name: Match package.json version to git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const e=require('child_process').execSync; const v=(process.env.GITHUB_REF_NAME||'').replace(/^v/,''); e('npm pkg set version='+JSON.stringify(v));"

      - name: Build Web App
        run: npm run build:web

      - name: Build & Publish Electron (Mac)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple certs in public CI — build unsigned rather than fail signing
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build & Publish Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avoid picking a random cert from the GHA image / hung signtool (EB 26+)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ format('{0}/eb-cache', env.RUNNER_TEMP) }}

      - name: Build & Publish Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
